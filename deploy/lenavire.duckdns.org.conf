# =============================================================================
#  LSPD — Manuel de Révision  ·  nginx (site statique)
#  Domaine : lenavire.duckdns.org
#
#  Installation :
#    sudo cp deploy/lenavire.duckdns.org.conf /etc/nginx/sites-available/
#    sudo ln -s /etc/nginx/sites-available/lenavire.duckdns.org.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#  (voir deploy/README.md pour le certificat Let's Encrypt)
# =============================================================================

# ----------------------------- HTTP :80 -------------------------------------
# Sert uniquement le challenge ACME puis redirige tout vers HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name lenavire.duckdns.org;

    # Let's Encrypt (certbot --webroot -w /var/www/certbot)
    location ^~ /.well-known/acme-challenge/ {
        root         /var/www/certbot;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# ----------------------------- HTTPS :443 -----------------------------------
server {
    # HTTP/2 activé sur la ligne listen (compatible nginx < 1.25.1).
    # Sur nginx >= 1.25.1 cela émet juste un avertissement de dépréciation ;
    # tu peux alors remplacer par "listen 443 ssl;" + "http2 on;".
    listen      443 ssl http2;
    listen      [::]:443 ssl http2;
    server_name lenavire.duckdns.org;

    root  /var/www/lenavire;          # <-- déposer ici lspd-revision.html, app.js, styles.css, assets/, 4xx/50x.html
    index lspd-revision.html;

    # ------------------------------- TLS ------------------------------------
    ssl_certificate         /etc/letsencrypt/live/lenavire.duckdns.org/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/lenavire.duckdns.org/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/lenavire.duckdns.org/chain.pem;

    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;            # TLS 1.3 : laisser le client choisir
    ssl_ecdh_curve            X25519:secp384r1;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;

    # OCSP stapling
    ssl_stapling         on;
    ssl_stapling_verify  on;
    resolver             1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout     5s;

    # ----------------------- En-têtes de sécurité ---------------------------
    # Définis au niveau "server" : ils sont hérités par toutes les réponses
    # TANT QU'aucun bloc location n'ajoute son propre add_header. C'est pourquoi
    # le cache plus bas utilise "expires" (et non add_header Cache-Control),
    # ce qui préserve l'héritage de ces en-têtes. 'always' = envoyés aussi sur les erreurs.
    add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy     "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options      "nosniff" always;
    add_header X-Frame-Options             "DENY" always;
    add_header Referrer-Policy             "no-referrer" always;
    add_header Permissions-Policy          "accelerometer=(), autoplay=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy  "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-XSS-Protection            "0" always;        # filtre legacy désactivé (déprécié, source de bugs)

    server_tokens        off;                  # masque la version nginx
    client_max_body_size 1m;                   # pas d'upload sur un site statique
    charset              utf-8;

    # ------------------------------ Compression -----------------------------
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    # ------------------- N'autoriser que GET / HEAD -------------------------
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }

    # ------------------- Bloquer les fichiers/dossiers cachés ---------------
    # (.git, .claude, .env, etc.) — sauf /.well-known
    location ~ /\.(?!well-known) { deny all; }

    # favicon.ico demandé par certains navigateurs -> pointe vers le PNG
    location = /favicon.ico { try_files /assets/favicon-32.png =204; access_log off; log_not_found off; }

    # ------------------------------- Cache ----------------------------------
    # Assets : cache long. "expires" ne casse PAS l'héritage des add_header.
    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires    30d;
        access_log off;
        try_files  $uri =404;
    }

    # ---------------------- Belles URLs (routeur) ---------------------------
    # /grades, /codes-penaux, /traffic-stop … servent la page unique ;
    # le routeur JS (app.js) lit l'URL et ouvre le bon onglet.
    # On redirige la variante avec slash final vers la version sans slash,
    # sinon les chemins relatifs des assets (styles.css, assets/…) cassent.
    rewrite ^/(grades|tenues|codes-penaux|codes-radio|miranda|procedures|traffic-stop|divisions|quiz)/$ /$1 permanent;
    location ~ ^/(?:grades|tenues|codes-penaux|codes-radio|miranda|procedures|traffic-stop|divisions|quiz)$ {
        # Maintenance (deploy/maintenance.sh) : si le drapeau existe -> 503.
        if (-f $document_root/.maintenance) { return 503; }
        expires   -1;
        try_files /lspd-revision.html =404;
    }

    # HTML & tout le reste : pas de cache agressif (les mises à jour s'affichent)
    location / {
        # Maintenance (deploy/maintenance.sh) : si le drapeau .maintenance existe,
        # tout renvoie 503 + page 50x.html. Test fait à chaque requête : aucun
        # reload nginx nécessaire pour basculer on/off. La page d'erreur et ses
        # assets passent par les blocs "location =" / cache (sans ce test) -> pas
        # de boucle de redirection interne.
        if (-f $document_root/.maintenance) { return 503; }
        expires   -1;                          # => Cache-Control: no-cache
        try_files $uri $uri/ =404;
    }

    # --------------------------- Pages d'erreur -----------------------------
    error_page 403 /403.html;
    error_page 404 /404.html;
    error_page 405 /405.html;
    error_page 500 502 503 504 /50x.html;
    location = /403.html { internal; }
    location = /404.html { internal; }
    location = /405.html { internal; }
    location = /50x.html { internal; }
}
